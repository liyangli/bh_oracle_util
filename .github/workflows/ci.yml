name: Rust checks and binaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check Windows-only Rust code on Linux
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: bh_oracle_util-${{ matrix.os }}
          path: |
            target/release/bh_oracle_util
            target/release/bh_oracle_util.exe
            config/*.toml
            deploy/*
            README.md
