[package]
name = "bh_oracle_util"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Oracle listener monitoring, log retention and bounded recovery"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
